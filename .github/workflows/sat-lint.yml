name: SAT lint

on:
  push:
    paths:
      - 'sat/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/sat-lint.yml'
  pull_request:
    paths:
      - 'sat/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/sat-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --manifest-path sat/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path sat/Cargo.toml --all-targets --locked
