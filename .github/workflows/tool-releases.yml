name: Build and release tools

on:
  pull_request:
    paths:
      - 'external_tools/**'
      - 'sat/**'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - '.github/workflows/tool-releases.yml'
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'external_tools/**'
      - 'sat/**'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - '.github/workflows/tool-releases.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-releases-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  versions:
    name: Check release versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tools: ${{ steps.selection.outputs.tools }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test release selection and versions
        run: python3 -m unittest discover -s scripts -p 'test_release.py'
      - name: Check Cargo, lockfile, and tool metadata versions
        run: python3 scripts/release.py
      - name: Select release tools
        id: selection
        run: echo "tools=$(python3 scripts/release.py --matrix)" >> "$GITHUB_OUTPUT"
      - name: Require the pushed tag to match the bundle version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py --check-tag "$RELEASE_TAG"

  build:
    name: Build ${{ matrix.tool }}
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.versions.outputs.tools) }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      TOOL: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        if: matrix.tool != 'python' && matrix.tool != 'markitdown'
        with:
          workspaces: external_tools/${{ matrix.tool }} -> target
          key: tools-${{ matrix.tool }}-wasi-sdk-34
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install verified WASI SDK for C/C++ tools
        if: matrix.tool == 'code'
        env:
          SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          echo "$SDK_SHA256  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/wasi-sdk.tar.gz" --directory "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Check Python build-cache invalidation
        if: matrix.tool == 'python'
        run: python3 -m unittest discover -s external_tools/python -p 'test_build.py'
      - name: Build the installable WASI archive
        run: bash "external_tools/$TOOL/package.sh" tar
      - name: Verify archive contents and metadata
        run: python3 external_tools/check_archives.py "external_tools/$TOOL/dist/"*.tar
      - uses: actions/upload-artifact@v7
        with:
          name: tool-${{ matrix.tool }}
          path: external_tools/${{ matrix.tool }}/dist/*.tar
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Validate packages with SAT
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sat -> target
          key: tool-release-host
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@v8
        with:
          pattern: tool-*
          path: release-assets
          merge-multiple: true
      - name: Build SAT from this release's sources
        run: cargo build --locked --manifest-path sat/Cargo.toml
      - name: Check archives, register tools, and validate their entrypoints
        run: python3 external_tools/check_archives.py --complete --sat sat/target/debug/sat release-assets/*.tar
      - name: Check host capability boundaries and process exit handling
        run: cargo test --locked --manifest-path sat/Cargo.toml
      - name: Check code and jaq execution and filesystem boundaries
        run: |
          mkdir -p external_tools/code/dist external_tools/jaq/dist
          cp release-assets/code.tar external_tools/code/dist/code.tar
          cp release-assets/jaq.tar external_tools/jaq/dist/jaq.tar
          cargo build --locked --release --manifest-path external_tools/jaq/Cargo.toml --bin jaq-native
          python3 external_tools/test_imported_tools.py --skip-build
          python3 external_tools/code/test_selectors.py --sat sat/target/debug/sat
      - name: Check original MarkItDown PDF and CLI tests
        run: |
          git init "$RUNNER_TEMP/markitdown-upstream"
          git -C "$RUNNER_TEMP/markitdown-upstream" remote add origin https://github.com/microsoft/markitdown.git
          git -C "$RUNNER_TEMP/markitdown-upstream" fetch --depth 1 origin ed178952a6672abdfd35b5f9e76a80b6cefc086e
          git -C "$RUNNER_TEMP/markitdown-upstream" checkout --detach FETCH_HEAD
          python3 -m venv "$RUNNER_TEMP/markitdown-native"
          "$RUNNER_TEMP/markitdown-native/bin/python" -m pip install \
            "$RUNNER_TEMP/markitdown-upstream/packages/markitdown[pdf]" pytest==9.2.0 \
            pdfminer.six==20260107 pdfplumber==0.11.10 charset-normalizer==3.5.2
          export SAT_HOME="$RUNNER_TEMP/markitdown-registry"
          printf '[]\n[]\n[]\n[]\n[]\nunset\n' | sat/target/debug/sat register release-assets/markitdown.tar
          "$RUNNER_TEMP/markitdown-native/bin/python" external_tools/markitdown/test_upstream.py \
            --upstream "$RUNNER_TEMP/markitdown-upstream" \
            --python "$RUNNER_TEMP/markitdown-native/bin/python" \
            --sat "$PWD/sat/target/debug/sat" --output "$RUNNER_TEMP/markitdown-results"
          "$RUNNER_TEMP/markitdown-native/bin/python" external_tools/markitdown/test_cli.py \
            --python "$RUNNER_TEMP/markitdown-native/bin/python" --sat "$PWD/sat/target/debug/sat"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: markitdown-upstream-results
          path: ${{ runner.temp }}/markitdown-results/
          if-no-files-found: warn
      - name: Check Python execution and sandbox boundaries
        run: |
          mkdir -p external_tools/python/dist
          cp release-assets/python.tar external_tools/python/dist/python.tar
          python3 external_tools/python/test.py --skip-build --sat sat/target/debug/sat

  release:
    name: Publish tool archives
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: tool-*
          path: release-assets
          merge-multiple: true
      - name: Verify the complete set of release assets
        run: python3 external_tools/check_archives.py --complete release-assets/*.tar
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.tar > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release-assets/*.tar release-assets/SHA256SUMS)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # Reruns can finish an interrupted upload without creating another release.
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            options=(--verify-tag --generate-notes --title "$RELEASE_TAG")
            if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${options[@]}"
          fi
