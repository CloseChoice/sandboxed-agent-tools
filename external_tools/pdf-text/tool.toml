name = "pdf-text"
version = "0.1.0"
description = "Extract embedded PDF text with page numbers. Text/JSON previews; no OCR."
entrypoint = "extract"
verbatim_output = true
fuel = 1000000000

[[arguments]]
name = "path"
help = "Absolute PDF file path. Requires a separate --read grant."

[options.start-page]
default = 1
help = "First page to extract (one-based)."

[options.max-pages]
default = 20
help = "Maximum pages to return (1..200). Use a small number for previews."

[options.max-bytes]
default = 65536
help = "Maximum UTF-8 text bytes across returned pages (1..1048576), excluding formatting. Truncation is explicit."

[options.format]
default = "text"
help = "text (page headings) or json (page records and continuation metadata)."

[[examples]]
command = 'sat pdf-text /absolute/report.pdf --max-pages 2 -- --read /absolute/report.pdf'

[[examples]]
command = 'sat pdf-text /absolute/report.pdf --format json --start-page 3 -- --read /absolute/report.pdf'
