[package]
name = "sat-patch-guest"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "patch-native"
path = "src/main.rs"

[dependencies]
wit-bindgen = "=0.57.1"
clap = { version = "=4.6.7", features = ["derive"] }
diffy = { version = "=0.5.2", default-features = false, features = ["std"] }

[workspace]
