name = "file-search"
version = "0.1.0"
description = "Search explicitly granted UTF-8 files for literal text"
entrypoint = "search"
[[arguments]]
name = "query"
help = "Literal, case-sensitive query"
[[arguments]]
name = "paths"
help = "Newline-separated absolute paths to granted files"
[options.before]
short = "B"
help = "Lines before each match (overrides context)"
[options.after]
short = "A"
help = "Lines after each match (overrides context)"
[options.context]
short = "C"
help = "Lines before and after each match"
default = 0
