name = "browser"
version = "0.1.0"
description = "Control a dedicated Chrome: DOM, clicks, typing, waits, screenshots and diagnostics"
entrypoint = "run"
verbatim_output = true

[[arguments]]
name = "action"
help = "tabs, new, close, navigate, snapshot, query, click, fill, type, press, scroll, evaluate, wait-visible, wait-text, screenshot, diagnostics, batch, cdp"

[options.target]
help = "CSS selector; use >>> to enter open shadow roots or same-origin iframes"
[options.value]
help = "URL, text, JavaScript, key, or JSON batch/CDP request, depending on action"
[options.tab]
help = "Target ID from tabs/new; required when more than one page is open"
[options.output]
help = "Screenshot path (requires a separate write grant); existing file or inside a granted directory"
[options.timeout]
default = 5000
help = "Wait/action timeout in milliseconds, 1..30000"

[[examples]]
command = 'sat browser navigate --value http://127.0.0.1:8000 -- --allow-cdp ws://127.0.0.1:9222/devtools/browser/ID'
[[examples]]
command = 'sat browser click --target "button.save" -- --allow-cdp ws://127.0.0.1:9222/devtools/browser/ID'
