name = "uutils"
version = "0.1.0"
description = "Sandboxed upstream coreutils: head, tail, cat, wc, cut, sort, uniq, nl, ls, basename, dirname. Put SAT grants after the final -- separator."
entrypoint = "run"
fuel = 1000000000
stdin = "input"
command_output = true

[[arguments]]
name = "args"
help = "Utility name followed by its arguments, passed unchanged; Tool options precede the utility; host grants follow the final -- separator."
[options.input]
help = "Inline UTF-8 stdin; use --stdin for piped text."

[[examples]]
command = "sat uutils head -n 20 /absolute/src/main.rs -- --read /absolute/src"
[[examples]]
command = "printf 'b\\na\\n' | sat uutils --stdin sort"
