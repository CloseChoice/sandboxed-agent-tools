[package]
name = "sat-code-guest"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "=0.57.1"
tree-sitter = "=0.27.1"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
ignore = "=0.4.34"
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace]
