name = "ffprobe"
version = "0.1.0"
description = "FFprobe 5.1.10 local-media metadata inspection with the upstream CLI and JSON/stream/format output. No network."
entrypoint = "run"
command_output = true
cli_passthrough = true

[[arguments]]
name = "args"
help = "Upstream ffprobe arguments. Explicit SAT permissions follow a separate --."

[[examples]]
command = 'sat ffprobe -v error -show_format -show_streams -of json /absolute/input.mp4 -- --read /absolute/input.mp4'
