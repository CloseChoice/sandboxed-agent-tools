name = "python"
version = "0.1.0"
description = "Run Python code in WASI; urllib HTTP/HTTPS uses host-enforced hostname grants."
entrypoint = "run"
exactly_one_of = ["code", "script"]

[[arguments]]
name = "script"
help = "Python file to execute (requires a read grant)."

[options.code]
short = "c"
help = "Python code to execute."

[[examples]]
command = 'sat python -c "print(1 + 2)"'

[[examples]]
command = 'sat python /absolute/script.py -- --read /absolute/script.py'

[[examples]]
command = "sat python -c 'import urllib.request; print(urllib.request.urlopen(\"https://example.com\").status)' -- --allow-http example.com"
