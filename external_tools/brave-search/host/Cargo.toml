[package]
name = "brave-search-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
wasmtime = { version = "=48.0.7", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "async"] }
wasmtime-wasi = "=48.0.7"
wasmtime-wasi-http = "=48.0.7"
http = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
bytes = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
