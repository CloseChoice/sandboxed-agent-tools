[package]
name = "jaq"
version = "3.1.2"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "jaq-native"
path = "upstream/main.rs"

[features]
mimalloc = ["dep:mimalloc"]

[dependencies]
wit-bindgen = "=0.57.1"
jaq-all = { version = "=0.4.0", default-features = false, features = ["formats", "std-all"] }
dirs = "6.0"
env_logger = { version = "0.10.0", default-features = false }
log = "0.4.17"
tempfile = "3.3.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustyline = { version = "=13.0.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = { version = "=13.0.0", default-features = false, features = ["with-file-history"] }
mimalloc = { version = "0.1.29", default-features = false, optional = true }

[workspace]
