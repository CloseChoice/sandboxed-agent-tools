[package]
name = "sat-tesseract-guest"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ocr-native"
path = "src/main.rs"

[dependencies]
wit-bindgen = "=0.57.1"
clap = { version = "=4.6.7", features = ["derive"] }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "pnm", "bmp"] }

[workspace]
