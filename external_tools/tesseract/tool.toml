name = "tesseract"
version = "0.1.0"
description = "Tesseract 5.5.4 image OCR in WASI, with an embedded English model. PNG/JPEG/PNM/BMP to text, TSV or hOCR."
entrypoint = "run"
command_output = true
cli_passthrough = true

[[arguments]]
name = "args"
help = "Tesseract image-profile arguments; explicit host permissions follow a separate --."

[[examples]]
command = 'sat tesseract /absolute/scan.png stdout --psm 6 -- --read /absolute/scan.png'

[[examples]]
command = 'sat tesseract /absolute/scan.jpg stdout tsv -- --read /absolute/scan.jpg'
