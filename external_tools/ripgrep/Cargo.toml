[package]
name = "sat-ripgrep-guest"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "=0.57.1"
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"
ignore = "=0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

