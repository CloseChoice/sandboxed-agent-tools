name = "uutils"
version = "0.1.0"
description = "Sandboxed upstream coreutils: head, tail, cat, wc, cut, sort, uniq, nl, ls, basename, dirname. Put SAT grants before the command."
entrypoint = "run"
fuel = 1000000000
stdin = "input"
command_output = true

[[arguments]]
name = "args"
help = "Utility name followed by its arguments, passed unchanged; SAT flags must precede the utility."
[options.input]
help = "Inline UTF-8 stdin; use --stdin for piped text."

[[examples]]
command = "sat uutils --read ./src::/src head -n 20 /src/main.rs"
[[examples]]
command = "printf 'b\\na\\n' | sat uutils --stdin sort"
