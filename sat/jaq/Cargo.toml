[package]
name = "sat-jaq-guest"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "=0.57.1"
jaq-all = { version = "=0.4.0", default-features = false, features = ["std-all"] }
serde_json = { version = "1", features = ["preserve_order"] }

[workspace]
