[package]
name = "safe-agent-tools"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Safe Agent Toolbox"

[[bin]]
name = "sat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
wasmparser = "0.254"
wasm-encoder = "0.254"
wit-component = "0.254"
wasmtime = { version = "=48.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "async", "anyhow", "cache"] }
wasmtime-wasi = "=48.0.2"
wasmtime-wasi-http = "=48.0.2"
http = "1"
http-body-util = "0.1"
cap-std = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
