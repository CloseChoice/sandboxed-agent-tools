[package]
name = "sandboxed-agent-tools"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Sandboxed Agent Toolbox"

[lints.clippy]
all = "warn"

[[bin]]
name = "sat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
wasmtime = { version = "=48.0.7", default-features = false, features = ["component-model", "cranelift", "cache", "parallel-compilation", "runtime", "std", "async", "anyhow"] }
wasmtime-wasi = "=48.0.7"
wasmtime-wasi-http = "=48.0.7"
http = "1"
http-body-util = "0.1"
cap-std = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2"

cap-fs-ext = "4"
globset = "0.4"
tempfile = "3"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[dev-dependencies]
wat = "1"
