[package]
name = "safe-agent-tools"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Safe Agent Toolbox"

[[bin]]
name = "sat"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
wasmtime-wasi = { version = "48.0.2" }


[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wasmtime = { version = "=48.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }

[profile.release]
lto = true
opt-level = 3
strip = "debuginfo"
